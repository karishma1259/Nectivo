spring.application.name=nectivo-backend

# MySQL Database Connection (set via environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nectivo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server port
server.port=${PORT:8080}

# JWT settings (required)
jwt.secret=${JWT_SECRET:change-this-secret-in-production}
jwt.expiration-ms=86400000

# Email (Gmail SMTP) settings for OTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS - allow the React frontend to call this API
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173}